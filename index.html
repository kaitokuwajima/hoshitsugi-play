<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | 星継ぎの剣</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="星継ぎの剣">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
      html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0f1e}
      #unity-container.unity-desktop,#unity-container{position:fixed;left:0;top:0;width:100%;height:100%;transform:none}
      #unity-canvas{width:100%!important;height:100%!important;display:block}
      #unity-footer{display:none}
      #hoshi-fs{position:fixed;right:12px;bottom:12px;z-index:10;padding:8px 14px;font:bold 15px sans-serif;color:#fff;
        background:rgba(20,30,70,.75);border:2px solid #e8c874;border-radius:8px;cursor:pointer}
      #hoshi-fs:hover{background:rgba(40,60,130,.9)}
      #hoshi-rotate{display:none;position:fixed;inset:0;z-index:20;background:#0b0f1e;color:#f3ead0;font:bold 22px sans-serif;
        text-align:center;align-items:center;justify-content:center;flex-direction:column;line-height:1.8}
      @media (orientation:portrait){ .hoshi-touch #hoshi-rotate{display:flex} }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <button id="hoshi-fs" title="全画面">⛶ 全画面</button>
      <div id="hoshi-rotate"><div style="font-size:64px">📱↻</div>画面を 横向きに してください<br><span style="font-size:15px;opacity:.7">（スマホの画面の回転ロックを オフに）</span></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">星継ぎの剣</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FRENVOX",
        productName: "星継ぎの剣",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      var hoshiTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      if (hoshiTouch) {
        document.documentElement.className += ' hoshi-touch';
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => { window.hoshiInstance = unityInstance;
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };


      function hoshiFullscreen(){
        var el=document.documentElement;
        if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
        (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
      }
      var fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      if (!fsOk) {
        document.getElementById("hoshi-fs").style.display = "none";
        // iPhone の Safari は全画面ボタンが使えない → 状況に合わせて案内（ホーム画面から開いたときは出さない）
        var standalone = window.navigator.standalone || window.matchMedia("(display-mode: fullscreen)").matches || window.matchMedia("(display-mode: standalone)").matches;
        if (/iPhone|iPod|iPad/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) if (!standalone) {
          var tip = document.createElement("div");
          var inFrame = window.top !== window.self;
          tip.innerHTML = inFrame
            ? "Safari で 記録を 確実に 残すには <a href='https://kaitokuwajima.github.io/hoshitsugi-play/' target='_blank' style='color:#ffe27a'>専用ページ</a> で 遊んでください"
            : "共有ボタン（□↑）→「ホーム画面に追加」で、アプリのように 全画面で 遊べます";
          tip.style.cssText = "position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:15;padding:8px 14px;font:bold 14px sans-serif;color:#fff;background:rgba(20,30,70,.88);border:2px solid #e8c874;border-radius:8px;max-width:92%;text-align:center";
          document.body.appendChild(tip);
          setTimeout(function(){ tip.style.transition = "opacity 1s"; tip.style.opacity = "0"; setTimeout(function(){ tip.remove(); }, 1200); }, 12000);
        }
      }
      else if (typeof hoshiTouch !== "undefined" && hoshiTouch) { var b = document.getElementById("hoshi-fs"); b.style.bottom = "auto"; b.style.top = "10px"; }
      document.getElementById("hoshi-fs").onclick=function(e){hoshiFullscreen();canvas.focus();};
      canvas.addEventListener("click",function(){canvas.focus();});
      // ページを閉じる・読み込み直す・別のアプリに切り替える瞬間に、ゲームに自動で記録させる
      function hoshiSave(){ try { if (window.hoshiInstance) window.hoshiInstance.SendMessage("WebBridge", "SaveNow"); } catch(e) {} }
      window.addEventListener("pagehide", hoshiSave);
      window.addEventListener("beforeunload", hoshiSave);
      document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") hoshiSave(); });
      document.body.appendChild(script);

    </script>
  </body>
</html>
